<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Continuum">
  <title>Continuum</title>
  <defs>
    <linearGradient id="ctSurface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2488ff" />
      <stop offset="1" stop-color="#0b57d8" />
    </linearGradient>
    <clipPath id="ctTile">
      <rect x="0" y="0" width="512" height="512" rx="120" ry="120" />
    </clipPath>
    <!-- One angular cut: the ribbon's upper-right ends in a straight edge
         instead of closing into a second round lobe. -->
    <clipPath id="ctFacet">
      <path d="M-40 -260 L250 120 L460 265 L560 334 L560 560 L-40 560 Z" />
    </clipPath>
  </defs>

  <g clip-path="url(#ctTile)">
    <rect width="512" height="512" fill="url(#ctSurface)" />
    <circle cx="760" cy="-140" r="520" fill="#0b4cc0" />
    <circle cx="-170" cy="790" r="530" fill="#4fa3ff" />

    <g clip-path="url(#ctFacet)">
      <g fill="none" stroke="#ffffff" stroke-width="62">
        <ellipse cx="164" cy="250" rx="80" ry="72" transform="rotate(-30 164 250)" />
        <ellipse cx="348" cy="250" rx="80" ry="72" transform="rotate(30 348 250)" />
      </g>
      <path d="M104 288 L150 326 L88 392 Z" fill="#ffffff" />
    </g>
  </g>
</svg>
